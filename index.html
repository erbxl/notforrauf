    <div class="container nav-inner">

    </div>
  </header>

  <main id="main">
    <!-- HERO (pantalla 1 — titular emocional) -->
    <section class="hero" style="padding-bottom:1.5rem">
      <div class="container hero-inner">
        <p class="kicker" data-landinghero-kicker></p>
        <h1 class="hero-title" data-landinghero-title></h1>
        <p class="lede" data-landinghero-sub></p>
      </div>
    </section>

    <!-- MOTIVACIÓN (pantalla 2 — puente breve, una sola frase) -->
    <section class="section" id="motivations" style="padding-block:0 1.5rem">
      <div class="container">
        <p class="landing-motivation reveal" data-landingmotivation-text></p>
      </div>
    </section>

    <!-- SERVICIOS (pantalla 3+4 — puente + solución) -->
    <section class="section" id="services" style="padding-top:0">
      <div class="container">
        <p class="lede landing-bridge" data-landingbridge-text style="max-width:none"></p>
        <p class="kicker" data-landingservices-kicker style="margin-top:1.75rem"></p>
        <div class="landing-services-grid" data-landingservices-items></div>
      </div>
    </section>

    <!-- NOSOTROS / CONFIANZA (pantalla 5 — personas reales + cifras verificadas) -->
    <section class="section" id="about" style="background:var(--bg-2)">
      <div class="container">
        <div class="section-head">
          <p class="kicker" data-sobre-kicker></p>
          <h2 data-sobre-title></h2>
          <p class="lede" data-sobre-sub style="margin-top:.75rem"></p>
        </div>
        <div class="people-grid" data-people-items></div>
        <h3 data-proof-title style="font-size:1.15rem; text-align:center; margin:2.5rem 0 1.5rem"></h3>
        <div class="stat-row" data-proof-items style="text-align:center"></div>
      </div>
    </section>

    <!-- NUESTROS CLIENTES -->
    <section class="section" id="clients">
      <div class="container">
        <div class="section-head">
          <p class="kicker" data-landingclients-kicker></p>
          <h2 data-landingclients-title></h2>
        </div>
        <div class="testi-grid" data-testimonials></div>
      </div>
    </section>

    <!-- BLOQUE FINAL (pantalla 6 — cierre corto, repite la única CTA) -->
    <section class="section landing-final" id="final">
      <div class="container">
        <h2 data-landingfinal-title></h2>
        <p class="lede" data-landingfinal-sub style="margin-top:.75rem"></p>
        <a class="whatsapp-cta-final reveal" data-wa-link="final" href="#" target="_blank" rel="noopener noreferrer">
